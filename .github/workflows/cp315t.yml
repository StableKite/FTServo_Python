name: CPython 3.15t SDK wire contract
on: [push, pull_request]
permissions:
  contents: read
jobs:
  wire:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15t'
      - name: Install from source
        run: python -m pip install .
      - name: Natural GIL state
        run: python -c "import sys,scservo_sdk; print(sys.version); assert not sys._is_gil_enabled()"
      - name: Genuine SDK wire contract
        run: python -m unittest discover -s tests -v
      - name: GIL on control
        run: python -X gil=1 -m unittest discover -s tests -v
      - run: python -m pip check
